apiVersion: v1
kind: ConfigMap
metadata:
  name: clouddocs-config
  namespace: clouddocs
data:
  APP_ENV: "production"
  STORAGE_PROVIDER: "r2"
  R2_BUCKET_NAME: "clouddocs-storage"
  METRICS_ENABLED: "true"
  NEXT_PUBLIC_API_URL: "https://clouddocs.example.com"
  NEXT_PUBLIC_WS_URL: "wss://clouddocs.example.com"
  CORS_ORIGINS: "https://clouddocs.example.com"
