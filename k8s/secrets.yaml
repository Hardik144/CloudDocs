apiVersion: v1
kind: Secret
metadata:
  name: clouddocs-secrets
  namespace: clouddocs
type: Opaque
stringData:
  DATABASE_URL: "postgresql://clouddocs:clouddocs_password@postgres-service:5432/clouddocs"
  REDIS_URL: "redis://redis-service:6379/0"
  JWT_SECRET: "k8s-production-secret-clouddocs-change-in-cluster"
  R2_ACCOUNT_ID: "placeholder_r2_account_id"
  R2_ACCESS_KEY_ID: "placeholder_r2_key_id"
  R2_SECRET_ACCESS_KEY: "placeholder_r2_secret_key"
  R2_ENDPOINT: "https://placeholder.r2.cloudflarestorage.com"
