
services:
  postgres:
    image: postgres:16-alpine
    container_name: clouddocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clouddocs
      POSTGRES_PASSWORD: clouddocs_password
      POSTGRES_DB: clouddocs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouddocs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clouddocs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clouddocs-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://clouddocs:clouddocs_password@postgres:5432/clouddocs
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: production-secret-key-change-in-env-file-min32chars
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-clouddocs-storage}
      R2_ENDPOINT: ${R2_ENDPOINT}
      CORS_ORIGINS: http://localhost,http://localhost:3000,http://localhost:80
      METRICS_ENABLED: "true"
    volumes:
      - backend_storage:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clouddocs-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: clouddocs-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  backend_storage:
